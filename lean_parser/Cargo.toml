[package]
name = "lean_parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "lean_parser"
path = "src/lib.rs"

[[bin]]
name = "lean_parser"
path = "src/main.rs"

[dependencies]
nom = "7.1.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.20"
unicode-xid = "0.2.6"
